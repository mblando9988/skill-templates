# Skill CI - check Claude Code skills, subagents and plugins on every pull request.
#
# Drop this file into .github/workflows/skill-ci.yml of a repository that
# contains skills (.claude/skills/*/SKILL.md), subagents (.claude/agents/*.md)
# or plugins. It runs the skill-templates scripts:
#
#   format_skill.py --check    fails if a file is not in canonical form
#   validate_skill.py --strict fields, hooks, tools, models, plugin rules; the
#                              frontmatter is parsed by BOTH parsers Claude Code
#                              ships (Bun.YAML in native builds, eemeli/yaml in
#                              npm builds), so a skill that loads in one and not
#                              the other fails here
#   check_docs_safety.py       unsafe or broken hook commands in files and docs
#
# Hardening choices:
#   - permissions: contents: read, and no persisted git credentials.
#   - Every action is pinned to a full commit SHA (the comment names the tag).
#     Let Dependabot or Renovate bump them.
#   - The scripts run from a copy you vendor into your repository
#     (SKILL_TOOLS_DIR). Nothing is fetched and executed at CI time unless you
#     opt in with SKILL_TOOLS_REPO plus a full 40-character commit SHA.
#   - Paths come from the env block, never from ${{ }} interpolation inside
#     shell scripts, so a crafted branch or file name cannot inject commands.

name: skill-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Space-separated paths to check.
  SKILL_PATHS: ".claude"
  # Vendored copy of skill-templates/scripts (recommended): copy the scripts/
  # folder of https://github.com/mblando9988/skill-templates here.
  SKILL_TOOLS_DIR: ".github/skill-tools"
  # Optional remote fallback when SKILL_TOOLS_DIR is absent. The ref MUST be a
  # full 40-character commit SHA; tags and branches are refused.
  SKILL_TOOLS_REPO: "https://github.com/mblando9988/skill-templates.git"
  SKILL_TOOLS_REF: ""
  # Bun version that parses YAML like native Claude Code builds.
  BUN_VERSION: "1.3.11"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Locate the skill tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$SKILL_TOOLS_DIR/validate_skill.py" ]; then
            tools="$SKILL_TOOLS_DIR"
          else
            if [[ ! "$SKILL_TOOLS_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::No vendored tools in $SKILL_TOOLS_DIR and SKILL_TOOLS_REF is not a 40-character commit SHA."
              exit 1
            fi
            git init -q .skill-tools
            git -C .skill-tools fetch -q --depth 1 "$SKILL_TOOLS_REPO" "$SKILL_TOOLS_REF"
            git -C .skill-tools checkout -q FETCH_HEAD
            test "$(git -C .skill-tools rev-parse HEAD)" = "$SKILL_TOOLS_REF"
            tools=".skill-tools/scripts"
          fi
          # Exact versions from the lockfile; no install scripts run.
          npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
          echo "TOOLS=$tools" >> "$GITHUB_ENV"

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          read -ra paths <<< "$SKILL_PATHS"
          python3 "$TOOLS/format_skill.py" "${paths[@]}" --check

      - name: Validate (both Claude Code YAML parsers)
        shell: bash
        run: |
          set -euo pipefail
          read -ra paths <<< "$SKILL_PATHS"
          python3 "$TOOLS/validate_skill.py" "${paths[@]}" --strict

      - name: Hook safety
        shell: bash
        run: |
          set -euo pipefail
          read -ra paths <<< "$SKILL_PATHS"
          python3 "$TOOLS/check_docs_safety.py" "${paths[@]}" --strict
