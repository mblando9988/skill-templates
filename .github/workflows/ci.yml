# CI for this repository: unit tests for the scripts, then the scripts run on
# the repository's own skills, examples and templates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install the pinned YAML parser
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Skills, examples and plugins are canonical, valid and safe
        run: |
          set -euo pipefail
          python scripts/format_skill.py skills examples --check
          python scripts/validate_skill.py . skills examples --strict
          python scripts/check_docs_safety.py skills examples references README.md --strict

      - name: Templates are valid apart from their placeholders
        run: |
          set -euo pipefail
          python scripts/validate_skill.py templates/skill-md-template.md --kind skill --allow-placeholders --strict
          python scripts/validate_skill.py templates/agent-md-template.md --kind agent --allow-placeholders --strict
          python scripts/validate_skill.py templates/plugin --allow-placeholders --strict
          python scripts/check_docs_safety.py templates --strict
          python -m py_compile templates/script-template.py templates/hook-script-template.py
